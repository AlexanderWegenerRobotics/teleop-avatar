enabled:        true
stereo:         false
stream_fps:     60
stream_width:   848
stream_height:  480

stream_cameras:
  - camera:   "desk_cam"
    shm_name: "avatar_cam"
    eye:      "mono"

episode_listener_port: 7100

cameras:
  - name:         "desk_cam"
    eye:          "mono"
    source_type:  "mujoco"
    shm_name:     "avatar_cam"
    fps:           60
    source_width:  848
    source_height: 480

    stream:
      enabled:            true
      host:               "127.0.0.1"
      port:               5004
      feedback_port:      5005
      status_port:        5007
      status_interval_ms: 500
      bitrate_kbps:       4000
      fec_percentage:     10
      width:              848
      height:             480

    log:
      enabled:    true
      output_dir: "logs"
      width:      640
      height:     480
