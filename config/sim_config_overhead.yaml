rendering:
  enabled: false
  fps: 15

simulation:
  timestep: 0.001
  control_frequency: 1000
  model_path: "../models/mujoco/scenes/world_scene.xml"
  task_config: "../config/tasks/cups.yaml"   # empty

  ground_truth_wrench:
    enabled: true
    rate_hz: 200
    log_dir: "../log/"
    devices:
      - name: arm_left
        ee_body: "arm_left_fr3_link7"

devices:
  - name: arm_left
    model_path: "../models/mujoco/robots/franka_fr3/fr3_torque.xml"
    urdf_path: "../models/urdf/franka_fr3/fr3.urdf"
    root_body: "link0"
    urdf_ee_name: "fr3_link8"

  - name: camera_left
    model_path: "../models/mujoco/props/camera_realsense.xml"
    root_body: "camera_mount"
    attach_to: "arm_left_fr3_link7"
    attach_offset:
      position: [0.02, -0.02, 0.08]
      orientation: [0.9099, -0.0664, -0.1604, -0.3769]

objects:
  - name: rig
    type: static
    model_path: "../models/mujoco/props/overhead_rig.xml"
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: background_front
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [1.6, 0.4, 0]
      orientation: [1, 0, 0, 0]

  - name: background_right
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [0.4, -1.4, 0]
      orientation: [0.7071, 0, 0, -0.7071]

cameras:
  - name: workspace_overview_1
    enabled: true
    type: fixed
    pos: [1.1, 0, 1.9]
    look_at: [0.3, 0.3, 1.2]
    fovy: 60

  - name: workspace_overview_2
    enabled: true
    type: fixed
    pos: [1.0, 0.2, 0.95]
    look_at: [0.4, 0.4, 0.95]
    fovy: 60

  - name: workspace_overview_3
    enabled: true
    type: fixed
    pos: [0.3, 0.03, 1.655]
    look_at: [0.3, 0.03, 0.0]
    fovy: 60

  - name: desk_cam
    enabled: True
    type: fixed
    pos: [0.16, 0.45, 1.40]
    look_at: [0.55, 0.4, 0.82]
    fovy: 54.0   # realsense: 42.5

  - name: desk_cam_left
    enabled: True
    type: fixed
    pos: [0.1639, 0.4803, 1.4000]
    look_at: [0.5539, 0.4303, 0.8200]
    fovy: 54.0

  - name: desk_cam_right
    enabled: True
    type: fixed
    pos: [0.1561, 0.4197, 1.4000]
    look_at: [0.5461, 0.3697, 0.8200]
    fovy: 54.0
