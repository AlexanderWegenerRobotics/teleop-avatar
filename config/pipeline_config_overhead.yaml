enabled:        true
stereo:         true    # mono: false (streams desk_cam instead of desk_cam_stereo)
stream_fps:     60
stream_width:   1280    # mono: 848
stream_height:  720     # mono: 480

stream_cameras:
  - camera:   "desk_cam"
    shm_name: "avatar_cam"
    eye:      "mono"
    width:    848
    height:   480
  - camera:   "desk_cam_left"
    shm_name: "avatar_cam_left"
    eye:      "left"
  - camera:   "desk_cam_right"
    shm_name: "avatar_cam_right"
    eye:      "right"
  - camera:   "camera_left_rgb"
    shm_name: "avatar_wrist_cam_left"
    eye:      "aux"
    width:    640
    height:   480
  - camera:   "workspace_overview_1"
    shm_name: "avatar_workspace_cam_1"
    eye:      "aux"
    width:    640
    height:   480
  - camera:   "workspace_overview_2"
    shm_name: "avatar_workspace_cam_2"
    eye:      "aux"
    width:    640
    height:   480
  - camera:   "workspace_overview_3"
    shm_name: "avatar_workspace_cam_3"
    eye:      "aux"
    width:    640
    height:   480

episode_listener_port: 7100

audio:
  enabled:  false              # zed: true
  device:   "Maono"
  host:     "172.23.152.189"
  port:     5020
  bitrate:  64000
  frame_ms: 5
  channels: 1
  retry_s:  5

cameras:
  - name:          "desk_cam"
    eye:           "mono"
    source_type:   "mujoco"    # remote: realsense | v4l2
    realsense_serial: ""
    v4l2_device:   "/dev/video4"
    v4l2_format:   "yuyv"
    shm_name:      "avatar_cam"
    fps:           60
    source_width:  848
    source_height: 480
    auto_exposure: false
    exposure:      100         # v4l2: 80
    gain:          64          # v4l2: -1

    stream:
      enabled:            false   # mono: true
      host:               "127.0.0.1"   # remote: "10.112.24.173"
      port:               5004
      feedback_port:      5005
      status_port:        5007
      status_interval_ms: 500
      bitrate_kbps:       4000
      fec_percentage:     10
      width:              848
      height:             480

    log:
      enabled:    true
      output_dir: "logs"
      width:      640
      height:     480

  - name:              "desk_cam_stereo"
    eye:               "stereo"
    source_type:       "mujoco"
    shm_name:          "avatar_cam_left"
    stereo_combined:   true
    stereo_partner_shm: "avatar_cam_right"
    fps:               60
    source_width:      1280
    source_height:     720

    stream:
      enabled:            true
      host:               "127.0.0.1"   # remote: "10.112.24.173"
      port:               5004
      feedback_port:      5005
      status_port:        5007
      status_interval_ms: 500
      bitrate_kbps:       8000
      fec_percentage:     10
      width:              2560
      height:             720

    log:
      enabled:    true
      output_dir: "logs"
      width:      1280
      height:     360

  - name:          "wrist_cam_left"
    eye:           "aux"
    source_type:   "mujoco"    # remote: realsense
    realsense_serial: ""
    shm_name:      "avatar_wrist_cam_left"
    fps:           60
    source_width:  640
    source_height: 480

    stream:
      enabled:            false
      host:               "127.0.0.1"   # remote: "10.112.24.173"
      port:               5013
      feedback_port:      5014
      status_port:        5015
      status_interval_ms: 500
      bitrate_kbps:       1500
      fec_percentage:     10
      width:              640
      height:             480

    log:
      enabled:    true
      output_dir: "logs"
      width:      320
      height:     240

  - name:          "workspace_cam_1"
    eye:           "aux"
    source_type:   "mujoco"
    shm_name:      "avatar_workspace_cam_1"
    fps:           30
    source_width:  640
    source_height: 480

    stream:
      enabled: false

    log:
      enabled:    true
      output_dir: "logs"
      width:      640
      height:     480

  - name:          "workspace_cam_2"
    eye:           "aux"
    source_type:   "mujoco"
    shm_name:      "avatar_workspace_cam_2"
    fps:           30
    source_width:  640
    source_height: 480

    stream:
      enabled: false

    log:
      enabled:    true
      output_dir: "logs"
      width:      640
      height:     480

  - name:          "workspace_cam_3"
    eye:           "aux"
    source_type:   "mujoco"
    shm_name:      "avatar_workspace_cam_3"
    fps:           30
    source_width:  640
    source_height: 480

    stream:
      enabled: false

    log:
      enabled:    true
      output_dir: "logs"
      width:      640
      height:     480

  - name:           "head_zed"
    eye:            "stereo"
    source_type:    "zed"
    zed_serial:     15948839
    zed_resolution: "HD720"
    fps:            60
    auto_exposure:  true

    stream:
      enabled:            true
      host:               "172.23.152.189"
      port:               5004
      feedback_port:      5005
      status_port:        5007
      status_interval_ms: 500
      bitrate_kbps:       8000
      fec_percentage:     10
      width:              2560
      height:             720

    log:
      enabled:    false
