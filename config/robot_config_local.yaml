      remote_ip: "127.0.0.1"
      send_port: 8005
      receive_port: 7005
      frequency: 20
    base_pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: camera_right
    type: sensor
    enabled: True
    base_pose:
      position: [0, 0, 0]
      #orientation: [-0.5918, 0.8061, 0, 0]
      orientation: [0, 1, 0, 0]

  - name: camera_left
