      gamma:      0.05
      wtask:      [1, 1, 1, 1, 1, 1]

  - name: head
    type: head
    enabled: True
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8003
      receive_port: 7003
      frequency: 200

    transmission_absolute:
      remote_ip: "127.0.0.1"
      send_port: 8013
      receive_port: 7013
      frequency: 200

    base_pose:
      position: [0, 0, 1.704]
      orientation: [1, 0, 0, 0]
    q0: [0.0, -0.4]
    max_torque: [20, 20]
    max_torque_rate: [1000, 1000]
    control:
      kp_joint: [50, 50]
      kd_joint: [5, 5]
    camera:
      name: head_head_cam
      position: [0.05, 0.0, 0.035]
      euler_xyz: [1.5708, -1.5708, 0.0]
      belief_temperature: 3.0

  - name: hand_left
    type: gripper
    enabled: True
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8004
      receive_port: 7004
      frequency: 20
    base_pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: hand_right
    type: gripper
    enabled: True
