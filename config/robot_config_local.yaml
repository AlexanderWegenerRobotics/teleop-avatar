avatar:
  # Avatar control-loop rate. Also the orchestrator's tick rate: tick_id is
  # stamped once per iteration and LiveSource paces on it, so this is the
  # command rate. Independent of rendering.fps, which now only clocks
  # frame_id (camera frames, gaze join, policy inference).
  loop_rate_hz: 100
  log_dir: "../logs"
  transmission:
    remote_ip: "127.0.0.1"
    send_port: 8000
    receive_port: 7000
    frequency: 20

  # Episode signals forwarded to the avatar_pipeline process
  pipeline_logger:
    enabled:  true
    host:     "127.0.0.1"
    port:     7100          # must match pipeline_config.yaml episode_listener_port

  scene_objects:
    enabled: true
    host:    "127.0.0.1"
    port:    7200

  # running avatar alone without a twin listening on this port.
  twin_telemetry:
    enabled: true
    host:    "127.0.0.1"
    port:    7400            # must match reconciler_config.yaml listen_port
    frequency: 100

  self_collision:
    enabled: false
    d_min: 0.10
    alpha: 3.0
    beta: 0.1

devices:
  - name: arm_left
    type: arm
    enabled: True
    franka_ip: "172.16.0.2"
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8001
      receive_port: 7001
      frequency: 200

    transmission_absolute:
      remote_ip: "127.0.0.1"
      send_port: 8011
      receive_port: 7011
      frequency: 200

    gripper:
      grasp_confirm_tolerance_m: 0.005
      grasp_confirm_time_s: 0.050

    base_pose:
      position: [0, 0.4, 1.277]
      orientation: [0.5, -0.5,  0.5, -0.5]
    controller_axis_map:
      - [0, 1, 0]
      - [0, 0, 1]
      - [1, 0, 0]
    q0: [0.3, -1.1, 0.3, -2.0, 0.6, 2.9, 0.9]
    #q0: [0.0, -1.2, 0.17, -1.58, 0, 1.6, 0.0]
    max_torque: [87, 87, 87, 87, 12, 12, 12]
    max_torque_rate: [1000, 1000, 1000, 1000, 1000, 1000, 1000]
    q_min: [-2.7437, -1.7837, -2.9007, -3.0421, -2.8065, 0.5445, -3.0159]
    q_max: [ 2.7437,  1.7837,  2.9007, -0.1518,  2.8065, 4.5169,  3.0159]
    dq_max: [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]

    control:
      kp_joint: [600, 600, 600, 600, 250, 150, 50]
      kd_joint: [50,  50,  50,  50,  30,  25,  15]
      kp_cart: [1000, 1000, 1000, 125, 125, 125]
      kd_cart: [50, 50, 50, 15, 15, 15]
      eta_lin: 0.9
      eta_rot: 0.9
      ff_force_max: 30.0     # N
      ff_torque_max: 8.0     # Nm, FR3 wrist joint limit is 12
      kp_null: [20, 20, 20, 20, 8, 8, 8]
      kd_null: [2, 2, 2, 2, 1, 1, 1]
      # Nullspace posture (PostureOptimizer). The elbow orbit is searched each
      # state tick for the human-like swivel angle closest to the one at q0,
      # inside the joint-limit margin. enabled: false restores the fixed q0 pull.
      posture:
        enabled: true
        window_rad: 0.30
        samples: 7
        lead_rad: 0.15
        filter_tau_s: 0.20
        margin_rad: 0.30
        manip_floor: 0.0
        swivel_offset_deg: 0.0
        k_height: 0.0
        k_lateral: 0.0
      kp_joint_limit: [30, 28, 26, 22, 4, 8, 10]
      kd_joint_limit: [1.8, 1.6, 1.5, 1.35, 0.3, 0.5, 0.8]

    safety:
      workspace_min: [0.4, -0.4, 0.81]
      workspace_max: [1.1,  0.4, 1.6]
      table_height_world: 0.6754
      ee_fingertip_length: 0.127
      table_safety_margin: 0.01
      max_command_velocity: 0.7
      max_command_angular_velocity: 2.0
      # Second-order bound on the command target (validateTargetPose): |dv| <= a*dt,
      # plus a braking curve at 3a toward the raw target so a held-back target never
      # overshoots. 0 disables. 5 m/s^2 with workspace scale 1.5 on the interface.
      max_command_acceleration: 5.0          # m/s^2
      max_command_angular_acceleration: 25.0 # rad/s^2
      max_target_lead: 0.05
      # Rotational twin of max_target_lead, in radians. Bounds the rotational
      # spring: at kp_cart 125 Nm/rad, 0.10 rad is 12.5 Nm, which is already the
      # FR3 wrist ceiling (joints 5-7 are limited to 12 Nm), so this sits under
      # it. Raise if the wrist feels leashed during normal work; lower if the
      # logs show tau_J_range_violation on joints 5-7. 0 disables.
      max_target_lead_rot: 0.08
      max_tilt_angle: 1.74533

      # Collision reflex. Consumed by the sim Robot via setCollisionBehavior().
      # Lower thresholds only raise the contact flags; upper thresholds stop the
      # arm with a franka::ControlException, exactly as the FR3 reflex does.
      # Values are libfranka's own setDefaultBehavior example set.
      #
      # Without these the twin will push arbitrary force into a fixture that
      # would have reflex-stopped the plant, so anything recorded against it is
      # a habit that faults on hardware.
      #
      # Joint torques in Nm; forces (x,y,z) in N and (R,P,Y) in Nm, checked on
      # the STIFFNESS-frame wrench (K_F_ext_hat_K), same as hardware.
      collision_lower_torque: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
      collision_upper_torque: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
      collision_lower_force:  [20.0, 20.0, 20.0, 25.0, 25.0, 25.0]
      collision_upper_force:  [20.0, 20.0, 20.0, 25.0, 25.0, 25.0]
      collision_reflex_enabled: true
      # Consecutive 1 kHz ticks a crossing must persist before it trips. The
      # momentum observer's free-motion noise reaches ~5 N p95 on arm_right
      # (claude/external-wrench-estimator.md), so a single-sample trip would
      # fault on estimator noise. 5 ticks = 5 ms, short against any real
      # contact transient.
      collision_persist_ticks: 5
      joint_limit_buffer: 0.25
      joint_limit_torque_frac: 0.40

    control_mode: cartesian_impedance   # or: joint_ik | cartesian_impedance
    ik:
      kp_p:       [12.0, 12.0, 12.0] # task pos gain (1/s)
      kp_o:       3                         # task ori gain (1/s)
      v_lin_max:  0.8                        # m/s  (matches interpolator max_linear_vel)
      v_ang_max:  0.8                        # rad/s
      lambda:     0.01                       # LM damping
      mu:         0.01                       # posture-term weight; keep << lambda to not attenuate task
      kp_posture: [2, 2, 2, 2, 2, 2, 2]     # redundancy pull toward q0 - raise to fight bad configs
      qd_max:     [2.0, 2.0, 2.0, 2.0, 2.4, 2.4, 2.4]  # FR3 joint vel limits, ~8% buffer below hard limits
      t_brake:    0.10                       # s, position-limit braking horizon (~5xdt_state)
      a_max:      15.0                       # rad/s^2 per-joint accel cap
      gamma:      0.05                       # rad, joint-limit safety buffer
      wtask:      [1, 1, 1, 1, 1, 1]         # task weights [posx3, orix3]

  - name: arm_right
    type: arm
    enabled: True
    franka_ip: "172.16.0.2"
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8002
      receive_port: 7002
      frequency: 200

    transmission_absolute:  # see arm_left's transmission_absolute comment
      remote_ip: "127.0.0.1"
      send_port: 8012
      receive_port: 7012
      frequency: 200

    gripper:
      grasp_confirm_tolerance_m: 0.005
      grasp_confirm_time_s: 0.050

    base_pose:
      position: [0, -0.4, 1.277]
      orientation: [0.5, 0.5, 0.5, 0.5]
    controller_axis_map:
      - [0, -1,  0]
      - [0,  0, -1]
      - [1,  0,  0]
    q0: [0.3, -1.1, -0.3, -2.0, -0.5, 2.9, 0.9]
    #q0: [0.0, -1.2, -0.17, -1.58, 0, 1.6, 0.0]
    #max_torque: [40, 40, 40, 40, 6, 6, 6]       # sim: [87, 87, 87, 87, 12, 12, 12]
    max_torque: [87, 87, 87, 87, 12, 12, 12]
    max_torque_rate: [1000, 1000, 1000, 1000, 1000, 1000, 1000]
    q_min: [-2.7437, -1.7837, -2.9007, -3.0421, -2.8065, 0.5445, -3.0159]
    q_max: [ 2.7437,  1.7837,  2.9007, -0.1518,  2.8065, 4.5169,  3.0159]
    dq_max: [2.62, 2.62, 2.62, 2.62, 5.26, 4.18, 5.26]

    control:
      kp_joint: [600, 600, 600, 600, 250, 150, 50]
      kd_joint: [50,  50,  50,  50,  30,  25,  15]
      kp_cart:  [1000, 1000, 1000, 125, 125, 125]
      kd_cart:  [50, 50, 50, 15, 15, 15]
      eta_lin: 0.9
      eta_rot: 0.9
      ff_force_max: 30.0     # N
      ff_torque_max: 8.0     # Nm, FR3 wrist joint limit is 12
      kp_null:  [20, 20, 20, 20, 8, 8, 8]
      kd_null:  [2, 2, 2, 2, 1, 1, 1]
      # Nullspace posture (PostureOptimizer). The elbow orbit is searched each
      # state tick for the human-like swivel angle closest to the one at q0,
      # inside the joint-limit margin. enabled: false restores the fixed q0 pull.
      posture:
        enabled: true
        window_rad: 0.30
        samples: 7
        lead_rad: 0.15
        filter_tau_s: 0.20
        margin_rad: 0.30
        manip_floor: 0.0
        swivel_offset_deg: 0.0
        k_height: 0.0
        k_lateral: 0.0
      kp_joint_limit: [30, 28, 26, 22, 4, 8, 10]
      kd_joint_limit: [1.8, 1.6, 1.5, 1.35, 0.3, 0.5, 0.8]
    safety:
      workspace_min: [0.4, -0.4, 0.81]
      workspace_max: [1.1,  0.4, 1.6]
      table_height_world: 0.6754
      ee_fingertip_length: 0.127
      table_safety_margin: 0.01
      max_command_velocity: 0.7
      max_command_angular_velocity: 2.0
      # Second-order bound on the command target (validateTargetPose): |dv| <= a*dt,
      # plus a braking curve at 3a toward the raw target so a held-back target never
      # overshoots. 0 disables. 5 m/s^2 with workspace scale 1.5 on the interface.
      max_command_acceleration: 5.0          # m/s^2
      max_command_angular_acceleration: 25.0 # rad/s^2
      max_target_lead: 0.05
      # Rotational twin of max_target_lead, in radians. Bounds the rotational
      # spring: at kp_cart 125 Nm/rad, 0.10 rad is 12.5 Nm, which is already the
      # FR3 wrist ceiling (joints 5-7 are limited to 12 Nm), so this sits under
      # it. Raise if the wrist feels leashed during normal work; lower if the
      # logs show tau_J_range_violation on joints 5-7. 0 disables.
      max_target_lead_rot: 0.08
      max_tilt_angle: 1.74533

      # Collision reflex. Consumed by the sim Robot via setCollisionBehavior().
      # Lower thresholds only raise the contact flags; upper thresholds stop the
      # arm with a franka::ControlException, exactly as the FR3 reflex does.
      # Values are libfranka's own setDefaultBehavior example set.
      #
      # Without these the twin will push arbitrary force into a fixture that
      # would have reflex-stopped the plant, so anything recorded against it is
      # a habit that faults on hardware.
      #
      # Joint torques in Nm; forces (x,y,z) in N and (R,P,Y) in Nm, checked on
      # the STIFFNESS-frame wrench (K_F_ext_hat_K), same as hardware.
      collision_lower_torque: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
      collision_upper_torque: [20.0, 20.0, 18.0, 18.0, 16.0, 14.0, 12.0]
      collision_lower_force:  [20.0, 20.0, 20.0, 25.0, 25.0, 25.0]
      collision_upper_force:  [20.0, 20.0, 20.0, 25.0, 25.0, 25.0]
      collision_reflex_enabled: true
      # Consecutive 1 kHz ticks a crossing must persist before it trips. The
      # momentum observer's free-motion noise reaches ~5 N p95 on arm_right
      # (claude/external-wrench-estimator.md), so a single-sample trip would
      # fault on estimator noise. 5 ticks = 5 ms, short against any real
      # contact transient.
      collision_persist_ticks: 5
      joint_limit_buffer: 0.25
      joint_limit_torque_frac: 0.40

    control_mode: cartesian_impedance   # or: joint_ik | cartesian_impedance
    ik:
      kp_p:       [12.0, 12.0, 12.0] # task pos gain (1/s)
      kp_o:       9                        # task ori gain (1/s)
      v_lin_max:  2.0                        # m/s  (matches interpolator max_linear_vel)
      v_ang_max:  6.0                        # rad/s
      lambda:     0.01                       # LM damping
      mu:         0.00000001                       # posture-term weight; keep << lambda to not attenuate task
      kp_posture: [3, 3, 4, 4, 1, 1, 1]     # redundancy pull toward q0 - raise to fight bad configs
      qd_max:     [2.5, 2.5, 2.5, 2.5, 4.0, 4.0, 4.0]  # FR3 limits
      t_brake:    0.10                       # s, position-limit braking horizon (~5xdt_state)
      a_max:      80.0                       # rad/s^2 per-joint accel cap
      gamma:      0.05                       # rad, joint-limit safety buffer
      wtask:      [1, 1, 1, 1, 1, 1]         # task weights [posx3, orix3]

  - name: head
    type: head
    enabled: True
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8003
      receive_port: 7003
      frequency: 200

    base_pose:
      position: [0, 0, 1.704]
      orientation: [1, 0, 0, 0]
    q0: [0.0, -0.4]
    max_torque: [20, 20]
    max_torque_rate: [1000, 1000]
    control:
      kp_joint: [50, 50]
      kd_joint: [5, 5]
    camera:
      name: head_head_cam
      position: [0.05, 0.0, 0.035]
      euler_xyz: [1.5708, -1.5708, 0.0]
      belief_temperature: 3.0

  - name: hand_left
    type: gripper
    enabled: True
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8004
      receive_port: 7004
      frequency: 20
    base_pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: hand_right
    type: gripper
    enabled: True
    transmission:
      remote_ip: "127.0.0.1"
      send_port: 8005
      receive_port: 7005
      frequency: 20
    base_pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: camera_right
    type: sensor
    enabled: True
    base_pose:
      position: [0, 0, 0]
      orientation: [-0.5918, 0.8061, 0, 0]

  - name: camera_left
    type: sensor
    enabled: True
    base_pose:
      position: [0, 0, 0]
      orientation: [0, 1, 0, 0]