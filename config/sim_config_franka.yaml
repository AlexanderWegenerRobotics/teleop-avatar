rendering:
  enabled: true
  fps: 15

simulation:
  timestep: 0.001
  control_frequency: 1000
  model_path: "../models/mujoco/scenes/world_scene.xml"
  task_config: "../config/tasks/FMB_board_1.yaml"

  # MuJoCo ground truth for the momentum observer. SIMULATION ONLY -- this is
  # never read by the controller, never enters franka::RobotState, and the
  # source file is not even compiled in the WITH_FRANKA build.
  #
  # Writes ../log/<device>_wrench_truth.csv, joined against <device>_log.csv
  # on the sim_time column. Contact forces rather than an F/T sensor: a
  # MuJoCo site force sensor reports the load transmitted through the site,
  # i.e. gravity and inertia of everything distal plus contact, while the
  # observer estimates external wrench only.
  #
  # The primary comparison is tau_contact (here) against tau_ext (arm.csv).
  # Joint space, because that is what the observer estimates and because
  # joint torques carry no frame. The Cartesian columns are secondary and
  # need ee_body; without it they are blank and joint space still logs.
  ground_truth_wrench:
    enabled: true
    rate_hz: 200        # observer bandwidth is K_GMO=50 rad/s, ~8 Hz; 200 is ample
    log_dir: "../log/"
    devices:
      - name: arm_left
        ee_body: "hand_left_hand"
      - name: arm_right
        ee_body: "hand_right_hand"

devices:
  - name: arm_left
    model_path: "../models/mujoco/robots/franka_fr3/fr3_torque.xml"
    urdf_path: "../models/urdf/franka_fr3/fr3_franka_hand.urdf"
    root_body: "link0"
    urdf_ee_name: "fr3_hand"
    gripper_actuator: "actuator8"
  
  - name: hand_left
    model_path: "../models/mujoco/robots/franka_fr3/hand.xml"
    root_body: "hand"
    gripper_actuator: "actuator8"
    attach_to: "arm_left_fr3_link7"
    attach_offset:
      position: [0, 0, 0.107]
      orientation: [0.9239, 0, 0, -0.3827]

  - name: camera_left
    model_path: "../models/mujoco/props/camera_realsense.xml"
    root_body: "camera_mount"
    attach_to: "arm_left_fr3_link7"
    attach_offset:
      position: [0, -0.0, 0.107] 
      orientation: [0.9239, 0, 0, -0.3827]

  - name: arm_right
    model_path: "../models/mujoco/robots/franka_fr3/fr3_torque.xml"
    urdf_path: "../models/urdf/franka_fr3/fr3_franka_hand.urdf"
    root_body: "link0"
    urdf_ee_name: "fr3_hand"
    #urdf_ee_name: "fr3_link8"
    gripper_actuator: "actuator8"

  - name: hand_right
    model_path: "../models/mujoco/robots/franka_fr3/hand.xml"
    root_body: "hand"
    gripper_actuator: "actuator8"
    attach_to: "arm_right_fr3_link7"
    attach_offset:
      position: [0, 0, 0.107]
      orientation: [0.9239, 0, 0, -0.3827]

  - name: camera_right
    model_path: "../models/mujoco/props/camera_realsense.xml"
    root_body: "camera_mount"
    attach_to: "arm_right_fr3_link7"
    attach_offset:
      position: [0, 0.0, 0.107] 
      orientation: [0.9239, 0, 0, -0.3827]

  - name: head
    model_path: "../models/mujoco/robots/pan_tilt_dummy/pan_tilt_dummy.xml"
    root_body: "base"

objects:
  - name: table
    type: static
    model_path: "../models/mujoco/props/table.xml"
    pose:
      position: [0.4, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: wall
    type: static
    model_path: "../models/mujoco/props/wall.xml"
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: background_front
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [2.0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: background_left
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [0, 1.5, 0]
      orientation: [0.7071, 0, 0, 0.7071]

  - name: background_right
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [0, -1.5, 0]
      orientation: [0.7071, 0, 0, 0.7071]

  - name: target_right
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: false
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_left
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: false
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_raw_right
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: false
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_raw_left
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: false
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]


cameras:
  - name: workspace_overview_1
    enabled: False
    type: fixed
    pos: [1.5, 0, 0.8]
    look_at: [0.4, 0.0, 0.4]
    fovy: 90

  - name: workspace_overview_2
    enabled: False
    type: fixed
    pos: [0.3, 0.3, 1.9]
    look_at: [0.0, 0.0, 0.4]
    fovy: 90

  - name: workspace_overview_3
    enabled: False
    type: fixed
    pos: [0.5, 0.3, 0.9]
    look_at: [0.5, 0.0, 0.7]
    fovy: 90