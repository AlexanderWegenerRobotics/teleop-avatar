rendering:
  enabled: false
  fps: 15

simulation:
  timestep: 0.001
  control_frequency: 1000
  model_path: "../models/mujoco/scenes/world_scene.xml"

devices:
  - name: arm_left
    model_path: "../models/mujoco/robots/franka_fr3/fr3_torque.xml"
    urdf_path: "../models/urdf/franka_fr3/fr3_franka_hand.urdf"
    root_body: "link0"
    urdf_ee_name: "fr3_hand"
    gripper_actuator: "actuator8"
  
  - name: hand_left
    model_path: "../models/mujoco/robots/franka_fr3/hand.xml"
    root_body: "hand"
    gripper_actuator: "actuator8"
    attach_to: "arm_left_fr3_link7"
    attach_offset:
      position: [0, 0, 0.107]
      orientation: [0.9239, 0, 0, -0.3827]

  - name: camera_left
    model_path: "../models/mujoco/props/camera_realsense.xml"
    root_body: "camera_mount"
    attach_to: "arm_left_fr3_link7"
    attach_offset:
      position: [0, -0.0, 0.107] 
      orientation: [0.9239, 0, 0, -0.3827]

  - name: arm_right
    model_path: "../models/mujoco/robots/franka_fr3/fr3_torque.xml"
    urdf_path: "../models/urdf/franka_fr3/fr3_franka_hand.urdf"
    root_body: "link0"
    urdf_ee_name: "fr3_hand"
    #urdf_ee_name: "fr3_link8"
    gripper_actuator: "actuator8"

  - name: hand_right
    model_path: "../models/mujoco/robots/franka_fr3/hand.xml"
    root_body: "hand"
    gripper_actuator: "actuator8"
    attach_to: "arm_right_fr3_link7"
    attach_offset:
      position: [0, 0, 0.107]
      orientation: [0.9239, 0, 0, -0.3827]

  - name: camera_right
    model_path: "../models/mujoco/props/camera_realsense.xml"
    root_body: "camera_mount"
    attach_to: "arm_right_fr3_link7"
    attach_offset:
      position: [0, 0.0, 0.107] 
      orientation: [0.9239, 0, 0, -0.3827]

  - name: head
    model_path: "../models/mujoco/robots/pan_tilt_dummy/pan_tilt_dummy.xml"
    root_body: "base"

objects:
  - name: table
    type: static
    model_path: "../models/mujoco/props/table.xml"
    pose:
      position: [0.4, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: wall
    type: static
    model_path: "../models/mujoco/props/wall.xml"
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: background_front
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [2.0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: background_left
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [0, 1.5, 0]
      orientation: [0.7071, 0, 0, 0.7071]

  - name: background_right
    type: static
    model_path: "../models/mujoco/props/background.xml"
    pose:
      position: [0, -1.5, 0]
      orientation: [0.7071, 0, 0, 0.7071]

  - name: object_1
    type: dynamic
    role: object
    color: red
    body_name: parcel_red
    model_path: "../models/mujoco/props/parcel_red.xml"
    pose:
      position: [0.65, -0.20, 0.725]
      orientation: [1, 0, 0, 0]

  - name: object_2
    type: dynamic
    role: object
    color: red
    body_name: parcel_red
    model_path: "../models/mujoco/props/parcel_red.xml"
    pose:
      position: [0.65, 0.10, 0.725]
      orientation: [1, 0, 0, 0]

  - name: object_3
    type: dynamic
    role: object
    color: blue
    body_name: parcel_blue
    model_path: "../models/mujoco/props/parcel_blue.xml"
    pose:
      position: [0.65, 0.0, 0.725]
      orientation: [1, 0, 0, 0]

  - name: object_4
    type: dynamic
    role: object
    color: blue
    body_name: parcel_blue
    model_path: "../models/mujoco/props/parcel_blue.xml"
    pose:
      position: [0.65, 0.30, 0.725]
      orientation: [1, 0, 0, 0]

  - name: bin_1
    type: dynamic
    role: bin
    color: red
    body_name: plastic_box
    model_path: "../models/mujoco/props/plastic_box.xml"
    pose:
      position: [0.83, 0.14, 0.702]
      orientation: [1, 0, 0, 0]

  - name: bin_2
    type: dynamic
    role: bin
    color: blue
    body_name: plastic_box
    model_path: "../models/mujoco/props/plastic_box.xml"
    pose:
      position: [0.83, -0.14, 0.702]
      orientation: [1, 0, 0, 0]

  - name: target_right
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: False
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_left
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: False
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_raw_right
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: False
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]

  - name: target_raw_left
    type: mocap
    model_path: "../models/mujoco/props/target_frame.xml"
    enabled: False
    pose:
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0]


cameras:
  - name: workspace_overview_1
    enabled: False
    type: fixed
    pos: [1.5, 0, 0.8]
    look_at: [0.4, 0.0, 0.4]
    fovy: 90

  - name: workspace_overview_2
    enabled: False
    type: fixed
    pos: [0.3, 0.3, 1.9]
    look_at: [0.0, 0.0, 0.4]
    fovy: 90

  - name: workspace_overview_3
    enabled: False
    type: fixed
    pos: [0.5, 0.3, 0.9]
    look_at: [0.5, 0.0, 0.7]
    fovy: 90